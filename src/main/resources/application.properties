spring.application.name=scheduler
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/planner
spring.datasource.username=dior
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

bootstrap.server=localhost:9092
group.id=scheduler-group
trusted.packages=com.yuldashov.summarizationserver.dto,com.yuldashov.scheduler.dto
response.type=com.yuldashov.scheduler.dto.summarization.SummarizationResponse
container.name=summarization-reply



